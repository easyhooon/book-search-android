appId: io.github.easyhooon.booksearch.e2e
name: 시스템 프로세스 종료 전 상세와 로컬 저장
---
- launchApp:
    clearState: true
- tapOn:
    id: "search-field"
- inputText: "fixture"
- tapOn:
    id: "query-submit"
- tapOn:
    id: "book-favorite-isbn13:9780000000001"
- tapOn:
    id: "tab-Favorites"
- assertVisible: "Fixture Book 01"
- tapOn:
    id: "tab-Search"
- tapOn:
    id: "book-card-isbn13:9780000000002"
- assertVisible: "Fixture description"
- takeScreenshot: "before-system-kill"
